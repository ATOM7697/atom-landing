<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Gen Tool Comparison</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: white;
            padding-top: 30px;
            min-height: 70px;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        nav ul li {
            float: left;
        }
        nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            margin-right: 5px;
            background-color: #575f6a;
            border-radius: 3px;
        }
        main {
            padding: 20px;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <h1>Welcome to Lead Gen Tool Comparison</h1>
            <p>Explore the best lead generation tools and make an informed decision for your business.</p>
            <form action="#" method="post">
                <label for="tool">Select a tool:</label>
                <select id="tool" name="tool">
                    <option value="tool1">Tool 1</option>
                    <option value="tool2">Tool 2</option>
                    <option value="tool3">Tool 3</option>
                </select><br><br>
                <input type="submit" value="Compare Now">
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Your Company Name. All rights reserved.</p>
    </footer>
</body>
</html>
